spring.application.name=gadgetMarket
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Auction finalization scheduler (ms). Default should be slow to avoid DB polling spam.
app.auctions.finalizer.delay-ms=60000

# Email (MailHog for local dev - http://localhost:8025)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.from=no-reply@gadgetmarket.local
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads
